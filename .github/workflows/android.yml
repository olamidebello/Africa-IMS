name: Build AIMS Android
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing key
        env:
          KEYSTORE: ${{ secrets.AIMS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Configure AIMS_KEYSTORE_BASE64 and signing secrets first.'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/aims.jks"
      - name: Build signed release
        working-directory: android
        env:
          AIMS_KEYSTORE: ${{ runner.temp }}/aims.jks
          AIMS_STORE_PASSWORD: ${{ secrets.AIMS_STORE_PASSWORD }}
          AIMS_KEY_ALIAS: ${{ secrets.AIMS_KEY_ALIAS }}
          AIMS_KEY_PASSWORD: ${{ secrets.AIMS_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AIMS-Android
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publish repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk AIMS.apk
          gh release create "android-${GITHUB_RUN_NUMBER}" AIMS.apk --title 'AIMS Android' --notes 'Signed Android launcher for the AIMS secure web platform.'
